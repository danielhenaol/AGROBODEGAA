spring.application.name=agrobodega-backend

# ===============================
# POSTGRESQL / SUPABASE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# AUTH0
# ===============================
# Pendiente: se activa cuando se configure Auth0 (descomentar y definir las variables).
#spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
#spring.security.oauth2.resourceserver.jwt.audiences=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES}

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===============================
# LOGGING / MDC
# ===============================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [traceId=%X{traceId}] [%X{method}] %-5level %logger{36} - %msg%n

spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# SERVICIO DE NOTIFICACIONES
# ===============================
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
notification.service.token=${INTERNAL_TOKEN:}

# ===============================
# FLYWAY (migraciones en db/migration)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===============================
# CACHE (catalogos en memoria)
# ===============================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
