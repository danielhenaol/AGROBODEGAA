spring.application.name=agrobodega-notification-service
server.port=${SERVER_PORT:8082}

# --- Base de datos (Supabase): solo lectura de notification_template ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- Resend (correo). Sin clave, el servicio solo escribe el correo en el log ---
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

# --- Token compartido con el backend (opcional en local) ---
internal.token=${INTERNAL_TOKEN:}

management.endpoints.web.exposure.include=health,info
