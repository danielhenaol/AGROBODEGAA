server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: agrobodega-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Filtros que se aplican a TODAS las rutas
          default-filters:
            # Cabeceras de seguridad (X-Content-Type-Options, X-Frame-Options, etc.)
            - SecureHeaders
            # El gateway y el backend responden CORS: evita cabeceras duplicadas
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://agrobodegaa.pages.dev}
                allowed-methods: GET,POST,PUT,DELETE,OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            # API de negocio
            - id: backend-api
              uri: ${BACKEND_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
            # Documentacion Swagger
            - id: backend-docs
              uri: ${BACKEND_URL:http://localhost:8080}
              predicates:
                - Path=/swagger-ui.html,/swagger-ui/**,/api-docs/**
          # El servicio de notificaciones NO se expone: solo lo llama el backend.

management:
  endpoints:
    web:
      exposure:
        include: health,info
